[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetload"
version = "1.0.0"
description = "Load and verify software across a fleet of embedded devices (A/B slots, canary rollout, config baselines)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kyle Gibson" }]
dependencies = ["pyyaml>=6.0", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fleetload = "fleetload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: integration tests against the docker compose fleet (deselect with -m 'not docker')"]
