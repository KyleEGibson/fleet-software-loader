name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not docker"

  fleet:
    name: Integration (6-container fleet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m docker
      - name: Demo rollout and load record
        if: always()
        run: |
          docker compose up -d --build --wait
          fleetload build firmware/sensor-head
          fleetload build firmware/gimbal-ctrl
          fleetload deploy sensor-head:2.4.2 gimbal-ctrl:1.3.0 --operator github-actions
          fleetload status
          cat reports/load-record-*.md >> "$GITHUB_STEP_SUMMARY"
          docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-record
          path: reports/
