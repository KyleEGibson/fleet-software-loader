# 4 sensor heads + 2 gimbal controllers, HW revs A and B, on localhost:9001-9006.
# Faults: add -f docker-compose.faults.yml

x-device: &device
  build: ./device
  image: fleet-device:latest
  environment: &env
    FACTORY_VERSION: "1.0.0"
    BOOT_SECONDS: "1.5"

services:
  sh-01:
    <<: *device
    environment: { <<: *env, DEVICE_ID: sh-01, ROLE: sensor-head, HW_REV: "A" }
    ports: ["127.0.0.1:9001:8080"]
  sh-02:
    <<: *device
    environment: { <<: *env, DEVICE_ID: sh-02, ROLE: sensor-head, HW_REV: "A" }
    ports: ["127.0.0.1:9002:8080"]
  sh-03:
    <<: *device
    environment: { <<: *env, DEVICE_ID: sh-03, ROLE: sensor-head, HW_REV: "B" }
    ports: ["127.0.0.1:9003:8080"]
  sh-04:
    <<: *device
    environment: { <<: *env, DEVICE_ID: sh-04, ROLE: sensor-head, HW_REV: "B" }
    ports: ["127.0.0.1:9004:8080"]
  gc-01:
    <<: *device
    environment: { <<: *env, DEVICE_ID: gc-01, ROLE: gimbal-ctrl, HW_REV: "A" }
    ports: ["127.0.0.1:9005:8080"]
  gc-02:
    <<: *device
    environment: { <<: *env, DEVICE_ID: gc-02, ROLE: gimbal-ctrl, HW_REV: "B" }
    ports: ["127.0.0.1:9006:8080"]
